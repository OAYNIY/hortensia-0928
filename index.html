<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FDF4EE">
<!-- 隐私：禁止搜索引擎收录 / 禁止外链泄漏来源 -->
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
<meta name="referrer" content="no-referrer">
<title>正在准备中</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    background:#FDF4EE;
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,-apple-system,sans-serif;
    color:#5A4A46;
    display:flex;align-items:center;justify-content:center;
    overflow:hidden;position:relative;
    -webkit-font-smoothing:antialiased;
  }
  /* 水彩晕染底 */
  .wash{position:fixed;border-radius:50%;filter:blur(60px);opacity:.55;pointer-events:none}
  .w1{width:60vmin;height:60vmin;background:#F7C8C2;top:-18vmin;left:-14vmin;animation:drift1 22s ease-in-out infinite}
  .w2{width:52vmin;height:52vmin;background:#F3DCC4;bottom:-16vmin;right:-12vmin;animation:drift2 26s ease-in-out infinite}
  .w3{width:44vmin;height:44vmin;background:#DCE6DC;bottom:8vmin;left:-16vmin;opacity:.42;animation:drift1 30s ease-in-out infinite reverse}
  @keyframes drift1{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(4vmin,3vmin) scale(1.08)}}
  @keyframes drift2{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(-4vmin,-3vmin) scale(1.1)}}

  canvas{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}

  main{position:relative;z-index:2;text-align:center;padding:0 28px;max-width:520px}

  .mark{
    width:64px;height:64px;margin:0 auto 30px;position:relative;
  }
  .mark::before,.mark::after{
    content:"";position:absolute;inset:0;border-radius:50%;
    border:1.5px solid #E8B4AE;
  }
  .mark::before{animation:breathe 3.6s ease-in-out infinite}
  .mark::after{animation:breathe 3.6s ease-in-out infinite .9s;opacity:.7}
  @keyframes breathe{
    0%{transform:scale(.55);opacity:0}
    40%{opacity:.9}
    100%{transform:scale(1.15);opacity:0}
  }
  .mark svg{position:absolute;inset:0;margin:auto;display:block}

  h1{
    font-size:clamp(20px,5.6vw,25px);
    font-weight:500;letter-spacing:.12em;line-height:2;
    color:#5A4A46;
  }
  p{
    margin-top:20px;
    font-size:clamp(12.5px,3.5vw,14px);
    font-weight:300;letter-spacing:.16em;line-height:2.1;
    color:#9A8880;
  }
  .line{
    width:34px;height:1px;background:#E8CFC6;margin:30px auto 0;
    transform-origin:center;animation:grow 4s ease-in-out infinite;
  }
  @keyframes grow{0%,100%{transform:scaleX(.5);opacity:.5}50%{transform:scaleX(1);opacity:1}}
</style>
</head>
<body>
  <div class="wash w1"></div>
  <div class="wash w2"></div>
  <div class="wash w3"></div>
  <canvas id="dust"></canvas>

  <main>
    <div class="mark">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none">
        <path d="M12 20.5s-7.5-4.6-7.5-9.7A4.3 4.3 0 0 1 12 7.6a4.3 4.3 0 0 1 7.5 3.2c0 5.1-7.5 9.7-7.5 9.7z"
              stroke="#E0A29B" stroke-width="1.3" stroke-linejoin="round"/>
      </svg>
    </div>

    <h1>这里还在慢慢长大</h1>
    <div class="line"></div>
  </main>

<script>
(function () {
  var c = document.getElementById('dust');
  if (!c) return;
  var ctx = c.getContext('2d');
  var dpr = Math.min(window.devicePixelRatio || 1, 2);
  var W, H, parts = [];

  function resize() {
    W = c.clientWidth; H = c.clientHeight;
    c.width = W * dpr; c.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  function make(n) {
    parts = [];
    for (var i = 0; i < n; i++) {
      parts.push({
        x: Math.random() * W,
        y: Math.random() * H,
        r: Math.random() * 1.6 + 0.5,
        vy: -(Math.random() * 0.16 + 0.05),
        vx: (Math.random() - 0.5) * 0.12,
        a: Math.random() * 0.35 + 0.12,
        ph: Math.random() * Math.PI * 2
      });
    }
  }

  function tick(t) {
    ctx.clearRect(0, 0, W, H);
    for (var i = 0; i < parts.length; i++) {
      var p = parts[i];
      p.x += p.vx + Math.sin(t / 2600 + p.ph) * 0.16;
      p.y += p.vy;
      if (p.y < -8) { p.y = H + 8; p.x = Math.random() * W; }
      if (p.x < -8) p.x = W + 8;
      if (p.x > W + 8) p.x = -8;
      var alpha = p.a * (0.65 + 0.35 * Math.sin(t / 1400 + p.ph));
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(226,176,166,' + alpha.toFixed(3) + ')';
      ctx.fill();
    }
    requestAnimationFrame(tick);
  }

  resize(); make(70);
  window.addEventListener('resize', function () { resize(); make(70); });
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
