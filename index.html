<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0b0c">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
<meta name="googlebot" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<link rel="icon" href="data:,">
<title>A GIFT</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    height: 100%; background: #0b0b0c; color: #e9e5dd; overflow: hidden; touch-action: none;
    font-family: "PingFang SC", "Noto Serif SC", "Songti SC", serif;
  }
  /* 与画册同一套舞台：750×1334 逻辑尺寸，整体等比缩放居中 */
  #stage {
    position: absolute; left: 0; top: 0;
    width: 750px; height: 1334px;
    transform-origin: top left;
    overflow: hidden; background: #0b0b0c;
  }
  .wrap {
    position: absolute; left: 0; right: 0; top: 44%;
    display: flex; flex-direction: column; align-items: center;
  }
  .hint { font-size: 30px; letter-spacing: 0.24em; color: rgba(233,229,221,0.66); text-indent: 0.24em; }
  input {
    margin-top: 56px; width: 560px;
    background: transparent; border: 0;
    border-bottom: 1px solid rgba(233,229,221,0.32);
    color: #f4f0e8; font-size: 46px; text-align: center;
    letter-spacing: 0.16em; text-indent: 0.16em;
    padding: 20px 10px 18px; outline: none;
    font-family: inherit; caret-color: #f4f0e8;
    transition: border-color 0.35s ease, opacity 0.35s ease;
  }
  input:focus { border-bottom-color: rgba(233,229,221,0.85); }
  .confirm {
    margin-top: 34px; min-width: 190px; padding: 14px 34px;
    border: 1px solid rgba(233,229,221,0.38); border-radius: 999px;
    background: rgba(233,229,221,0.08); color: #f4f0e8;
    font: inherit; font-size: 22px; letter-spacing: .16em;
    cursor: pointer; transition: background .25s ease, border-color .25s ease, opacity .25s ease;
  }
  .confirm:active { background: rgba(233,229,221,0.18); }
  .wrap.busy input { opacity: 0.35; }
  .wrap.busy .confirm { opacity: .35; pointer-events: none; }
  .err { margin-top: 30px; min-height: 30px; font-size: 22px; letter-spacing: 0.12em; color: #c98b7f; }
</style>
</head>
<body>
<div id="stage">
  <div class="wrap" id="wrap">
    <div class="hint">请输入你的名字</div>
    <input id="code" type="text" inputmode="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" maxlength="24">
    <button class="confirm" id="confirm" type="button">确认</button>
    <div class="err" id="err"></div>
  </div>
</div>
<script>
  var SALT_HEX = '1ab3b75e4be72681b58c4e36eba01455', ITER = 250000, STORE_KEY = 'unlock-code';
  var wrap = document.getElementById('wrap');
  var input = document.getElementById('code');
  var errEl = document.getElementById('err');
  var confirmBtn = document.getElementById('confirm');
  var stage = document.getElementById('stage');

  // 与画册完全一致的缩放逻辑
  function resize() {
    var s = Math.min(window.innerWidth / 750, window.innerHeight / 1334);
    stage.style.transform = 'scale(' + s + ')';
    stage.style.left = ((window.innerWidth - 750 * s) / 2) + 'px';
    stage.style.top = ((window.innerHeight - 1334 * s) / 2) + 'px';
  }
  window.addEventListener('resize', resize);
  resize();

  function norm(s) { return String(s).normalize('NFKC').replace(/\s+/g, ''); }   // 全角/半角、空格都统一
  function hexToBuf(h) {
    var a = new Uint8Array(h.length / 2);
    for (var i = 0; i < a.length; i++) a[i] = parseInt(h.substr(i * 2, 2), 16);
    return a;
  }
  async function deriveKey(code) {
    var base = await crypto.subtle.importKey('raw', new TextEncoder().encode(code), 'PBKDF2', false, ['deriveKey']);
    return crypto.subtle.deriveKey(
      { name: 'PBKDF2', salt: hexToBuf(SALT_HEX), iterations: ITER, hash: 'SHA-256' },
      base, { name: 'AES-GCM', length: 256 }, true, ['encrypt', 'decrypt']);
  }
  async function decryptJson(path, key) {
    var r = await fetch(path, { cache: 'no-store' });
    if (!r.ok) throw new Error('缺少 ' + path);
    var buf = await r.arrayBuffer();
    var plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: buf.slice(0, 12) }, key, buf.slice(12));
    return JSON.parse(new TextDecoder().decode(plain));
  }
  async function handKeyToSW(key, map) {
    var reg = await navigator.serviceWorker.register('sw.js');
    await navigator.serviceWorker.ready;
    var raw = await crypto.subtle.exportKey('raw', key);
    var target = reg.active || navigator.serviceWorker.controller;
    if (!target) throw new Error('解密层未就绪');
    await new Promise(function (res) {
      var ch = new MessageChannel();
      ch.port1.onmessage = function () { res(); };
      target.postMessage({ type: 'unlock', raw: raw, map: map }, [ch.port2]);
      setTimeout(res, 1200);
    });
  }
  var trying = false;
  async function unlock(code, silent) {
    code = norm(code);
    if (!code || trying) return;
    trying = true;
    wrap.classList.add('busy');
    if (!silent) errEl.textContent = '';
    try {
      var key = await deriveKey(code);
      var map = await decryptJson('site/map.enc', key);      // 暗号不对会在这里失败
      await handKeyToSW(key, map);
      try { localStorage.setItem(STORE_KEY, code); } catch (e) {}
      if (!navigator.serviceWorker.controller && !sessionStorage.getItem('rl')) {
        sessionStorage.setItem('rl', '1');                    // 先让解密层接管本页
        location.reload();
        return;
      }
      location.replace('app.html' + location.search);
    } catch (e) {
      try { localStorage.removeItem(STORE_KEY); } catch (e2) {}
      wrap.classList.remove('busy');
      trying = false;
      if (!silent) { errEl.textContent = '不对哦，再试一次'; input.select(); }
    }
  }

  input.addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); unlock(input.value, false); } });
  confirmBtn.addEventListener('click', function () { unlock(input.value, false); });
  document.addEventListener('click', function (e) { if (e.target !== input) input.focus(); });

  var saved = null;
  try { saved = localStorage.getItem(STORE_KEY); } catch (e) {}
  if (saved) { unlock(saved, true); } else { setTimeout(function () { input.focus(); }, 260); }
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function () {});
</script>
</body>
</html>
